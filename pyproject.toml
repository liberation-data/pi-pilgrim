[project]
name = "pi-pilgrim"
version = "0.3.0"
description = "Dependency injection for Python: a port of Pilgrim, the successor to Typhoon."
authors = [{ name = "Jasper Blues", email = "jasper@liberation-data.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["dependency injection", "di", "ioc", "composition root", "pilgrim", "typhoon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/liberation-data/pi-pilgrim"
Repository = "https://github.com/liberation-data/pi-pilgrim"

[tool.poetry]
packages = [{ include = "pipilgrim" }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
