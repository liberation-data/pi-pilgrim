name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this as its gate, so that a release passes the same CI as a pull request, unless a push or
  # pull_request run of it has already passed on the same tree.
  workflow_call:

permissions:
  contents: read

jobs:
  # Records the git tree this run tests, as an artifact named ci-tree-<tree>, so a release of the same tree can trust
  # this run and skip its gate (scripts/ci_trust.py). It matters on a pull request, which tests its merge ref, not the
  # head commit the run names. It has no condition, as no job here may: release.yml trusts a run only when every job
  # in it passed, and a job skipped by a condition doesn't.
  tree:
    name: record the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work out the tree
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree $(git rev-parse HEAD)" > ci-tree.txt
          echo "This run tests tree $tree, of commit $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
      # Overwritten when the run is re-run, as an artifact's name is unique within a run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tree-${{ steps.tree.outputs.tree }}
          path: ci-tree.txt
          if-no-files-found: error
          overwrite: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      # pi-pilgrim has no dependencies, and its tests are unittest's, so they run on the bare interpreter.
      - name: Test
        run: uv run --no-project python -m unittest -v
      # The package and the release scripts type-check clean, each on the matrix Python: mypy targets the interpreter
      # it runs on, and pyright is told. The checkers are pinned, so that a new release of one doesn't fail a pull
      # request that changed nothing; raise the pins on purpose. The tests aren't type-checked.
      - name: mypy
        run: uvx mypy==2.4.0 --strict pipilgrim scripts
      - name: pyright
        run: uvx pyright==1.1.414 --pythonversion "${{ matrix.python }}" pipilgrim scripts
      # pyproject.toml is valid for Poetry, and poetry.lock is up to date with it.
      - name: Poetry check
        run: uvx poetry==2.5.1 check --lock
      - name: Build
        run: uv build --no-sources
