name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this as its gate, so that a release passes the same CI as a pull request.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      # pi-pilgrim has no dependencies, and its tests are unittest's, so they run on the bare interpreter.
      - name: Test
        run: uv run --no-project python -m unittest -v
      - name: Build
        run: uv build --no-sources
